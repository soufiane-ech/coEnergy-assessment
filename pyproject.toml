[project]
name = "coenergy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "matplotlib", "pandas"]

[dependency-groups]
dev = ["jupyter"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coenergy"]
